# Scheduled scrape, then publish to Cloudflare when content changed (deploy.yml).
# Daily quick sync costs one request (a 304) when nothing has changed; the weekly full sync
# re-fetches every note to catch silent in-place edits.
name: sync

on:
  schedule:
    - cron: "17 6 * * *"      # daily 06:17 UTC, quick
    - cron: "47 5 * * 0"      # Sundays 05:47 UTC, full
  workflow_dispatch:
    inputs:
      full:
        description: Re-fetch every note
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      # pdftotext: the second reader of PDFs that `cpin compare` puts every difference to (docs/methods/pdf-and-web.md).
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
      - run: pytest -q

      # Mirrored PDFs and images are not in git. Keep them between runs: a file is asked "changed since?"
      # only when the copy is on this disk, so without them each run would download every file it checks
      # again (politely, but all 170 MB of PDFs on a full run). A cold cache fetches each once.
      - uses: actions/cache@v4
        with:
          path: |
            data/pdfs/files
            data/images/files
          key: mirror-${{ hashFiles('data/pdfs/manifest.json', 'data/images/manifest.json') }}
          restore-keys: mirror-

      # Nothing from here to the commit may stop the commit: what was fetched is kept, whatever fails after
      # it. Each of these steps still fails the job at the end (the last step).
      - name: Sync
        id: sync
        continue-on-error: true
        run: |
          if [ "${{ github.event.schedule }}" = "47 5 * * 0" ] || [ "${{ inputs.full }}" = "true" ]; then
            python -m cpin sync --full
          else
            python -m cpin sync
          fi

      # TODO(R2): upload new files from data/pdfs/files/ to the R2 bucket once it exists.

      # Editions published as a PDF only are read from their PDFs (text kept in data/pdfs/text/, committed).
      # A PDF that is not on this disk keeps the text extracted earlier.
      - name: Text of PDF-only editions
        id: pdftext
        continue-on-error: true
        run: python -m cpin pdftext

      # The standing checks of docs/methods/pdf-and-web.md (an edition whose PDF is not on this disk keeps
      # the records made earlier): the pictures a PDF has that the web version leaves out, and the real
      # differences between the two publications. Each record is written whole, so one that fails part-way
      # leaves the others fit to commit.
      - name: Pictures only the PDF has
        id: figures
        continue-on-error: true
        run: python -m cpin pdftext --figures
      - name: Web version against PDF
        id: compare
        continue-on-error: true
        run: python -m cpin compare

      - name: Commit data changes
        id: commit
        run: |
          git config user.name "cpin-explorer bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          # A quiet day only appends to runs.jsonl; don't make a commit for that alone.
          if git diff --cached --name-only | grep -qv '^data/runs.jsonl$'; then
            git commit -m "data: sync $(date -u +%F)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No content changes."
          fi

      # After the commit: one image that will not download, or one PDF that fails, must not hold back
      # every later day's data while the fault lasts. It fails the job here instead.
      - name: Verify
        run: python -m cpin verify

      - name: Fail if the sync or a step after it had errors
        if: >-
          steps.sync.outcome == 'failure' || steps.pdftext.outcome == 'failure' ||
          steps.figures.outcome == 'failure' || steps.compare.outcome == 'failure'
        run: exit 1

  # Publish what was committed (a push by this workflow's token doesn't trigger deploy.yml itself).
  deploy:
    needs: sync
    if: ${{ !cancelled() && needs.sync.result == 'success' && needs.sync.outputs.changed == 'true' }}
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
