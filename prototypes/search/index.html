<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Search · CPIN Explorer</title>
<link rel="icon" type="image/svg+xml" href="../../assets/cpin-explorer/favicon.svg">
<script>
  // The site has one search, in the header of the start page (../dashboard/). This page used to be a
  // separate full-text search; links to it (?q=&country=&kind=) land on the same results there.
  // The index itself still lives beside this file, in pagefind/ (built by `npm run search-index`).
  (function () {
    var from = new URLSearchParams(location.search), to = new URLSearchParams();
    var q = (from.get("q") || "").trim();
    if (q) {
      to.set("q", q);
      to.set("view", "passages");
      ["country", "kind"].forEach(function (key) { if (from.get(key)) to.set(key, from.get(key)); });
    }
    var qs = to.toString().replace(/%2C/g, ",");
    location.replace("../dashboard/index.html" + (qs ? "?" + qs : ""));
  })();
</script>
<noscript><meta http-equiv="refresh" content="0; url=../dashboard/index.html"></noscript>
</head>
<body>
<p>Search is on the <a href="../dashboard/index.html">CPIN Explorer start page</a>.</p>
</body>
</html>
