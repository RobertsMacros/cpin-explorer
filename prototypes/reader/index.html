<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reader · CPIN Extractor</title>
<meta name="description" content="Read the latest edition of a Home Office country policy and information note, verbatim from GOV.UK, and save highlighted passages with citations.">
<link rel="preload" href="../vendor/fonts/GeistPixel-Square.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../vendor/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" type="image/png" href="../../assets/roberts-macros/image.png">
<link rel="stylesheet" href="../shared/theme.css">
<link rel="stylesheet" href="reader.css">
<script>try { const t = localStorage.getItem("cpin-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}</script>
<script type="module" src="reader.js"></script>
</head>
<body class="is-loading">
<a class="skip" href="#doc">Skip to the note</a>
<header class="top">
  <a class="brand" href="../dashboard/index.html" aria-label="CPIN Extractor home">
    <img src="../../assets/roberts-macros/image.png" alt="Roberts Macros" width="30" height="30">
    <span class="brand-name">CPIN EXTRACTOR</span>
  </a>
  <div class="find" role="search">
    <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10.4 10.4 14 14" stroke="currentColor" stroke-width="1.4"/></svg>
    <input id="find" type="search" placeholder="Find in this note" autocomplete="off" spellcheck="false" aria-label="Find in this note" aria-describedby="findCount">
    <span class="find-count numeral" id="findCount" aria-live="polite"></span>
    <button class="find-step" id="findPrev" type="button" aria-label="Previous match (k or Shift+Enter)" disabled><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 10l4-4 4 4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>
    <button class="find-step" id="findNext" type="button" aria-label="Next match (j or Enter)" disabled><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>
    <kbd class="find-kbd">/</kbd>
  </div>
  <a class="btn saved-link" href="../saved/index.html" aria-label="Saved highlights"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5h8v11l-4-3-4 3z" fill="none" stroke="currentColor" stroke-width="1.4"/></svg><span>Saved</span><span class="saved-count numeral" id="savedCount">0</span></a>
  <button class="btn theme-btn" id="theme" type="button">AUTO</button>
  <div class="progress" aria-hidden="true"><i id="progress"></i></div>
</header>

<main class="reader" id="reader">
  <nav class="toc" id="toc" aria-label="Contents"></nav>
  <div class="center">
    <section class="note-head" id="head" aria-label="About this note"></section>
    <article class="doc" id="doc" tabindex="-1" aria-busy="true">
      <div class="skeleton" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    </article>
  </div>
  <aside class="rail" id="rail" aria-label="Saved from this note"></aside>
</main>

<footer class="foot">
  <span>Source: Home Office, <a href="https://www.gov.uk/government/collections/country-policy-and-information-notes" target="_blank" rel="noopener">GOV.UK</a>. Contains public sector information licensed under the <a href="https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/" target="_blank" rel="noopener">Open Government Licence v3.0</a>. An independent mirror, not affiliated with or endorsed by the Home Office.</span>
  <span class="foot-rm">Roberts Macros: no macro too micro.</span>
</footer>

<!-- Phones and narrow windows: contents and saved passages live in a slide-up sheet. -->
<div class="dock" id="dock">
  <button type="button" class="dock-btn" data-sheet="toc">Contents</button>
  <button type="button" class="dock-btn" data-sheet="saved">Saved <span class="numeral" id="dockCount">0</span></button>
</div>
<div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
<section class="sheet" id="sheet" aria-label="Contents and saved passages" aria-hidden="true" inert>
  <div class="sheet-grip" aria-hidden="true"></div>
  <div class="sheet-tabs" role="tablist">
    <button type="button" role="tab" class="sheet-tab" data-tab="toc" aria-selected="true">Contents</button>
    <button type="button" role="tab" class="sheet-tab" data-tab="saved" aria-selected="false">Saved</button>
    <button type="button" class="sheet-close" id="sheetClose" aria-label="Close">×</button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</section>

<!-- Selection toolbar, highlight popover, footnote popover and toasts are filled in by reader.js. -->
<div class="seltool" id="seltool" role="toolbar" aria-label="Selected passage" hidden></div>
<div class="pop" id="pop" role="dialog" aria-modal="false" hidden></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<noscript><p class="noscript">This reader needs JavaScript. The notes themselves are on <a href="https://www.gov.uk/government/collections/country-policy-and-information-notes">GOV.UK</a>.</p></noscript>
</body>
</html>
